# tmux server dedicated to the Agent4Discord bot (tmux -L a4d).
# Keep the pane around when the bot crashes so the error stays visible.
set -g remain-on-exit failed
set -g history-limit 50000
set -g mouse on
set -g status-style "bg=colour54,fg=white"
set -g status-left "[a4d] "
set -g status-right "Ctrl-b d: 나가기 (봇은 계속 실행) "
set -g status-right-length 60
